name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it.
          - silverstripe: '5'
            php: '8.1'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            recipe: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd: the suite draws its test images with GD, and GD is the image backend that encodes
          # the WebP (and, where the build has libavif, AVIF) variants
          # imagick on SS5 only: PictureTest runs its assets 2 Imagick regression on it (the suite
          # stays on GD otherwise); on SS6 assets 3 would switch every test to Imagick once loaded
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session, fileinfo${{ matrix.silverstripe == '5' && ', imagick' || '' }}
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. The host
        # composer.json is written by hand - there is no skeleton package to create from,
        # recipe-cms is the thing to require.
        #
        # The module is pulled in through a PATH repository pointing at the checkout, symlinked
        # rather than mirrored ON PURPOSE: /tests is export-ignore in .gitattributes, so a mirrored
        # (dist-style) install would contain no tests and the suite would silently pass empty.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-webp-images": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\Silverstripe\\\\WebpImages\\\\Tests\\\\": "vendor/restruct/silverstripe-webp-images/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is in security-fixes-only until its April 2027 EOL, and every release
          # of silverstripe/cms 5 is covered by advisory PKSA-pjvm-vnw2-n3m2 (range <6.2.1), which
          # will not be patched there. Composer therefore refuses to install it under the default
          # policy. Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg.
               failOnSkipped: the suite has no skips by design (AVIF tests assert both the
               supported and the unsupported branch), so a skip means something broke. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true" failOnSkipped="true">
              <testsuites>
                  <testsuite name="webpimages">
                      <directory>vendor/restruct/silverstripe-webp-images/tests</directory>
                      <exclude>vendor/restruct/silverstripe-webp-images/tests/browser</exclude>
                  </testsuite>
                  <testsuite name="consumer">
                      <directory>app/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Add a consumer-shape database test
        # Guards a class of bug a module's own suite structurally cannot catch: an unbuildable
        # fixture in this module's tests/ dir fatals the temp-database build in every CONSUMING
        # project (quickaddnew 2.1.0). The module's fixtures are loaded by PHPUnit, not registered
        # in the class manifest, so only a test in the host exercises it.
        run: |
          mkdir -p app-host/app/tests
          cat > app-host/app/tests/ConsumerDbTest.php <<'PHP'
          <?php

          use SilverStripe\Dev\SapphireTest;
          use SilverStripe\Security\Member;

          class ConsumerDbTest extends SapphireTest
          {
              protected $usesDatabase = true;

              public function testTempDatabaseBuilds()
              {
                  $m = Member::create(['FirstName' => 'x']);
                  $m->write();
                  $this->assertGreaterThan(0, $m->ID);
              }
          }
          PHP

      - name: Run tests
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        # How the test manifest is flushed differs per major, and each way is inert on the other:
        # - framework 5 reads only a `flush=1` argument, and only PATH-FIRST
        #   (`phpunit <path> flush=1`). `--testsuite <name> flush=1` cannot carry it: PHPUnit
        #   takes `flush=1` as the test path. SS_PHPUNIT_FLUSH is never read on framework 5.
        # - framework 6 flushes on SS_PHPUNIT_FLUSH=1; PHPUnit 11 does not pass a `flush=1`
        #   argument through to it.
        # So every SS5 run is path-first with flush=1, and every SS6 run sets SS_PHPUNIT_FLUSH,
        # for both suites (each phpunit call is its own process with its own manifest boot).
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit vendor/restruct/silverstripe-webp-images/tests flush=1
            vendor/bin/phpunit app/tests flush=1
          else
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --testsuite webpimages
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --testsuite consumer
          fi

      - name: Boot the app and build the database
        # The suite proves the classes behave; this proves the module does not break a real boot
        # after a flush - the moment an unguarded class or bad config would fatal.
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/sake dev/build flush=1
            vendor/bin/sake dev/tasks | grep -q webp-images-purge-sidecars
            # Runs the purge task (dry run) through sake itself
            vendor/bin/sake dev/tasks/webp-images-purge-sidecars
          else
            vendor/bin/sake db:build --flush
            # Runs the task (dry run) through sake itself: catches a console-definition clash
            vendor/bin/sake tasks:webp-images-purge-sidecars -v
          fi

  phpstan:
    name: PHPStan (SS6)
    runs-on: ubuntu-latest
    # Silverstripe 6 only. The task entry point declares one trait per major behind a
    # class_exists() switch (see PurgeWebpSidecarsTaskEntryPoint); PHPStan always reads the first
    # (SS6) declaration, so an SS5 host reports that branch's SS6-only classes as missing.
    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, dom, xml, tokenizer, simplexml, ctype
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # Same host shape as the test job (symlinked path repository), plus the analysers.
        # cambis/silverstan resolves Silverstripe config and extensions from the host's manifest,
        # so it needs a host, not the module on its own. No database: analysis never boots the app.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "^6",
              "restruct/silverstripe-webp-images": "*"
            },
            "require-dev": {
              "phpstan/phpstan": "^2",
              "phpstan/extension-installer": "^1.4",
              "cambis/silverstan": "^2"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          composer update --no-interaction --no-progress

      - name: Analyse
        working-directory: app-host
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G -c vendor/restruct/silverstripe-webp-images/phpstan.neon.dist

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the module's declared php constraint, as exercised above.
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
